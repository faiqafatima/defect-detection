<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,1 L11,6 L0,11 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1100" height="600" fill="white"/>

  <!-- Legend -->
  <rect x="700" y="8" width="14" height="14" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="720" y="20" font-size="12">Train</text>
  <rect x="775" y="8" width="14" height="14" fill="#fff8e1" stroke="#f9a825"/>
  <text x="795" y="20" font-size="12">Validation</text>
  <rect x="880" y="8" width="14" height="14" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="900" y="20" font-size="12">Test</text>

  <!-- ===== Row 1: training pipeline ===== -->
  <text x="20" y="30" font-size="17" font-weight="bold">1. Training pipeline (src/)</text>

  <rect x="20" y="95" width="150" height="90" rx="8" fill="#f5f5f5" stroke="#616161"/>
  <text x="95" y="118" text-anchor="middle" font-weight="bold">MVTec AD bottle</text>
  <text x="95" y="136" text-anchor="middle">292 images:</text>
  <text x="95" y="153" text-anchor="middle">229 normal,</text>
  <text x="95" y="170" text-anchor="middle">63 defective</text>

  <rect x="195" y="95" width="160" height="90" rx="8" fill="#f5f5f5" stroke="#616161"/>
  <text x="275" y="125" text-anchor="middle">Duplicate check (MD5)</text>
  <text x="275" y="143" text-anchor="middle">Stratified split</text>
  <text x="275" y="161" text-anchor="middle">70/15/15, seed 42</text>

  <rect x="385" y="50" width="150" height="50" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="460" y="71" text-anchor="middle" font-weight="bold">Train set: 204</text>
  <text x="460" y="88" text-anchor="middle" font-size="11">160 normal, 44 defective</text>
  <rect x="385" y="115" width="150" height="50" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="460" y="136" text-anchor="middle" font-weight="bold">Validation set: 44</text>
  <text x="460" y="153" text-anchor="middle" font-size="11">35 normal, 9 defective</text>
  <rect x="385" y="190" width="150" height="50" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="460" y="211" text-anchor="middle" font-weight="bold">Test set: 44</text>
  <text x="460" y="228" text-anchor="middle" font-size="11">34 normal, 10 defective</text>

  <line x1="170" y1="140" x2="193" y2="140" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="355" y1="140" x2="383" y2="75" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="355" y1="140" x2="383" y2="140" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="355" y1="140" x2="383" y2="215" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="565" y="45" width="140" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="635" y="64" text-anchor="middle" font-size="11">Augment: flip, rotate,</text>
  <text x="635" y="81" text-anchor="middle" font-size="11">color jitter (train only)</text>
  <text x="635" y="98" text-anchor="middle" font-size="11">+ resize 224, normalize</text>
  <line x1="535" y1="75" x2="563" y2="75" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="705" y1="75" x2="733" y2="75" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="735" y="45" width="200" height="120" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="835" y="66" text-anchor="middle" font-weight="bold">ResNet18 (ImageNet pretrained)</text>
  <text x="835" y="87" text-anchor="middle" font-size="11">Phase 1: only new fc (512 to 2)</text>
  <text x="835" y="105" text-anchor="middle" font-size="11">Phase 2: + layer4, lr 1e-4</text>
  <text x="835" y="123" text-anchor="middle" font-size="11">conv1 to layer3 stay frozen</text>
  <text x="835" y="141" text-anchor="middle" font-size="11">Weighted loss (0.64 / 2.32)</text>

  <line x1="535" y1="140" x2="733" y2="140" stroke="#f9a825" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="635" y="132" text-anchor="middle" font-size="11">pick best epoch</text>

  <rect x="960" y="95" width="125" height="70" rx="8" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="1022" y="120" text-anchor="middle" font-weight="bold">Trained model</text>
  <text x="1022" y="138" text-anchor="middle" font-size="11">models/</text>
  <text x="1022" y="153" text-anchor="middle" font-size="11">resnet18_defect.pt</text>
  <line x1="935" y1="130" x2="958" y2="130" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="735" y="190" width="200" height="60" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="835" y="209" text-anchor="middle" font-weight="bold">Test evaluation (once)</text>
  <text x="835" y="226" text-anchor="middle" font-size="11">precision, recall, F1,</text>
  <text x="835" y="242" text-anchor="middle" font-size="11">confusion matrix, error analysis</text>
  <line x1="535" y1="215" x2="733" y2="215" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1000,165 L1000,220 L937,220" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Row 2: inference service ===== -->
  <text x="20" y="300" font-size="17" font-weight="bold">2. Inference service (app/)</text>
  <path d="M1050,165 L1050,300 L620,300 L620,368" fill="none" stroke="#ef6c00" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="835" y="293" text-anchor="middle" font-size="11" fill="#ef6c00">model file copied into Docker image</text>

  <rect x="185" y="335" width="715" height="225" rx="10" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="200" y="354" font-weight="bold" fill="#555">Docker container (python slim, CPU-only torch)</text>

  <rect x="20" y="370" width="140" height="80" rx="8" fill="#fce4ec" stroke="#c2185b"/>
  <text x="90" y="405" text-anchor="middle">Client uploads</text>
  <text x="90" y="423" text-anchor="middle">an image (POST)</text>

  <rect x="205" y="370" width="150" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="280" y="393" text-anchor="middle" font-weight="bold">FastAPI /predict</text>
  <text x="280" y="410" text-anchor="middle" font-size="11">checks type, size,</text>
  <text x="280" y="426" text-anchor="middle" font-size="11">valid image</text>
  <text x="280" y="442" text-anchor="middle" font-size="11">(415 / 413 / 400)</text>

  <rect x="380" y="370" width="130" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="445" y="405" text-anchor="middle">Preprocess</text>
  <text x="445" y="423" text-anchor="middle">(same as eval)</text>

  <rect x="535" y="370" width="170" height="80" rx="8" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="620" y="393" text-anchor="middle" font-weight="bold">ResNet18 model</text>
  <text x="620" y="411" text-anchor="middle" font-size="11">loaded once at startup</text>
  <text x="620" y="427" text-anchor="middle" font-size="11">(CPU inference)</text>

  <rect x="730" y="370" width="150" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="805" y="393" text-anchor="middle" font-weight="bold">Softmax</text>
  <text x="805" y="411" text-anchor="middle" font-size="11">class + confidence</text>
  <text x="805" y="427" text-anchor="middle" font-size="11">+ latency</text>

  <rect x="925" y="370" width="160" height="80" rx="8" fill="#fce4ec" stroke="#c2185b"/>
  <text x="1005" y="393" text-anchor="middle" font-weight="bold">JSON response</text>
  <text x="1005" y="411" text-anchor="middle" font-size="11">predicted_class,</text>
  <text x="1005" y="427" text-anchor="middle" font-size="11">confidence,</text>
  <text x="1005" y="443" text-anchor="middle" font-size="11">latency_ms</text>

  <line x1="160" y1="410" x2="203" y2="410" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="355" y1="410" x2="378" y2="410" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="410" x2="533" y2="410" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="705" y1="410" x2="728" y2="410" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="410" x2="923" y2="410" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="205" y="490" width="200" height="45" rx="8" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="305" y="509" text-anchor="middle" font-size="11">Logging: request id,</text>
  <text x="305" y="525" text-anchor="middle" font-size="11">prediction, latency</text>
  <line x1="280" y1="450" x2="280" y2="488" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="20" y="585" font-size="12" font-style="italic" fill="#555">Validation set only chooses the best epoch. Test set is used once, after training.</text>
</svg>
